<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Rental Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
  <nav>
    <a href="main.html"><img src="logos.png" alt="Logo"></a>
    <div class="nav-links">
      <a href="main.html">Home</a>
      <a href="product.html">Products</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="auth.html"><i class="fa-regular fa-circle-user"></i></a>
      <a href="#"><i class="fa-regular fa-heart"></i></a>
      <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2 id="authTitle">Welcome Back</h2>
          <p id="authSubtitle">Sign in to your account</p>
        </div>
        
        <form class="auth-form" id="authForm">
          <div class="form-group" id="nameGroup" style="display: none;">
            <label for="fullName"><i class="fa-regular fa-user"></i> Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
          </div>
          
          <div class="form-group">
            <label for="email"><i class="fa-regular fa-envelope"></i> Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>
          
          <div class="form-group">
            <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          
          <div class="form-group" id="confirmGroup" style="display: none;">
            <label for="confirmPassword"><i class="fa-solid fa-lock"></i> Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password">
            <div class="error-message" id="passwordError" style="display: none;">Passwords do not match</div>
          </div>
          
          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="remember">
              <span class="checkmark"></span>
              <span id="checkboxText">Remember me</span>
            </label>
            <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>
          </div>
          
          <button type="submit" class="auth-btn" id="authBtn">Sign In</button>
        </form>
        
        <div class="auth-footer">
          <p id="switchText">Don't have an account? <a href="#" id="switchLink">Sign Up</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Welcome Popup -->
  <div class="welcome-popup" id="welcomePopup" style="display: none;">
    <div class="welcome-content">
      <i class="fa-solid fa-check-circle"></i>
      <h3 id="welcomeMessage">Welcome!</h3>
      <p>Redirecting to home page...</p>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
